<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <h1>学生成绩管理系统</h1>
  <script>
    //在此编写js代码//
    let students = [];
    let student1 = {
      name: "孙增凯", math: 62, english: 413
    };
    let student2 = {
      name: "李轩州", math: 100, english: 682
    };
    students.push(student1);
    students.push(student2);
    console.log("初始学生列表:", students);
    //__________________________________________________________
    while (true) {
      // 显示菜单并获取用户选择
      let choice = prompt(
        "欢迎使用学生成绩管理系统\n请选择操作：\n1. 添加学生\n2. 显示所有学生\n3. 查询学生\n4. 删除学生\n5. 排序学生\n6. 修改学生\n7. 计算平均成绩\n8. 退出系统"
      );
      // 根据用户输入执行不同逻辑
      if (choice === "8") {
        alert("感谢使用，再见！");
        break; // 终止循环，结束程序
      }
      else if (choice === "1") {
        addStudent();
      }
      else if (choice === "2") {
        showAllStudents();
      }
      else if (choice === "3") {
        searchStudent();
      }
      else if (choice === "4") {
        deleteStudent();
      }
      else if (choice === "5") {
        sortStudents();
      }
      else if (choice === "6") {
        modifyStudent();
      }
      else if (choice === "7") {
        calculateAverage();
      }
      else {
        // 输入无效，提示用户重新输入
        alert("输入无效，请重试！");
      }
    }
    //__________________________________________________________
    function addStudent() {
      // 姓名检查
      let name = prompt("请输入学生姓名");
      if (!name || name.trim() === "") {
        alert("姓名不能为空！");
        return;
      }

      // 数学成绩检查
      let math = prompt("请输入数学成绩");
      math = Number(math);
      if (isNaN(math) || math < 0 || math > 100) {
        alert("数学成绩必须是0-100之间的有效数字！");
        return;
      }

      // 英语成绩检查
      let english = prompt("请输入英语成绩");
      english = Number(english);
      if (isNaN(english) || english < 0 || english > 100) {
        alert("英语成绩必须是0-100之间的有效数字！");
        return;
      }

      let newStudent = {
        name: name.trim(),
        math: math,
        english: english
      };
      students.push(newStudent);
      alert("学生" + newStudent.name + "添加成功");
    }
    //__________________________________________________________
    function showAllStudents() {
      if (students.length == 0) {
        alert("当前没有学生信息");
        return;
      }
      let output = "学生成绩列表：\n========================\n";
      students.forEach(function (s, i) {
        output += '学生${i+1}: ${s.name} | 数:${s.math} 英:${s.eng}\n';
      });
      console.log(output);
      alert("已在控制台显示所有学生信息");
    }
    //__________________________________________________________
    function searchStudent() {
      let searchName = prompt("请输入要查询的学生姓名：");
      let found = false; // 标记是否找到
      for (let i = 0; i < students.length; i++) {
        let student = students[i];
        // 使用 === 进行严格相等比较
        if (student.name === searchName) {
          alert(`找到学生: ${student.name} | 数:${student.math} 英:${student.english}`);
          found = true;
          break;
        }
      }
      // 如果循环结束都没找到
      if (!found) { alert("未找到..."); }
    }
    //__________________________________________________________
    function deleteStudent() {
      let deleteName = prompt("请输入要删除的学生姓名：");
      let found = false;
      for (let i = 0; i < students.length; i++) {
        let student = students[i];
        if (student.name === deleteName) {
          students.splice(i, 1);
          found = true;
          alert("删除成功");
          break;
        }
      }
      if (!found) {
        alert("未找到要删除的学生");
      }
    }
    //__________________________________________________________
    function modifyStudent() {
      let modifyName = prompt("请输入要修改的学生姓名：");
      let found = false;
      for (let i = 0; i < students.length; i++) {
        let student = students[i];
        if (student.name === modifyName) {
          student.math = prompt("请输入新的数学成绩");
          student.english = prompt("请输入新的英语成绩");
          found = true;
          alert("修改成功");
          break;
        }
      }
      if (!found) {
        alert("未找到要修改的学生");
      }
    }
    //__________________________________________________________
    function calculateAverage() {
      let total = 0;
      students.forEach(function (s) {
        total += s.math + s.english;
      });
      let average = total / students.length;
      alert(`所有学生的平均成绩为: ${average}`);
    }
    //__________________________________________________________
    function sortStudents() {
      students.sort(function (a, b) {
        return a.math + a.english - b.math - b.english;
      });
      alert("已按总成绩排序");
    }
  </script>
</body>

</html>
