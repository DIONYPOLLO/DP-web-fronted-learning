<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>演示：高度塌陷问题</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    /* 父盒子：不写高度，默认由子元素撑开 */
    .parent {
      border: 4px solid blue;
      background: #e3f2fd;
      padding: 10px;
    }

    /* 两个子元素都设置浮动 */
    .child {
      width: 100px;
      height: 100px;
      background: red;
      color: white;
      text-align: center;
      line-height: 100px;
      margin: 5px;

      /* 🔥 浮动导致高度塌陷 */
    }
  </style>
</head>

<body>
  <h2>👇 蓝色父盒子 高度塌陷了（变成一条线）</h2>

  <!-- 父盒子 -->
  <div class="parent">
    <div class="child">1</div>
    <div class="child">2</div>
  </div>
</body>

</html>
