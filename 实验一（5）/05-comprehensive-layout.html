<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>实验5：综合布局案例</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 1. 固定导航栏（fixed） */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #333;
            color: white;
            line-height: 60px;
            padding: 0 20px;
            z-index: 999;
        }

        /* 2. 整体容器：避开固定导航栏 */
        .wrapper {
            margin-top: 70px;
            width: 1200px;
        }

        /* 3. 左侧侧边栏（float） */
        .sidebar {
            float: left;
            width: 200px;
            height: 500px;
            background: #e3f2fd;
            padding: 20px;
        }

        /* 4. 右侧内容区（自适应） */
        .content {
            margin-left: 200px;
            padding: 20px;
        }

        /* 5. 内容卡片（子绝父相） */
        .card {
            position: relative;
            width: 100%;
            height: 200px;
            background: #f5f5f5;
            border: 1px solid #ddd;
            margin-bottom: 20px;
            padding: 20px;
        }

        .top-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            background: #f44336;
            color: white;
            font-size: 12px;
        }

        /* 6. 清除浮动 */
        .clearfix::after {
            content: "";
            display: block;
            clear: both;
            height: 0;
            visibility: hidden;
        }

        .clearfix {
            *zoom: 1;
        }
    </style>
</head>

<body>
    <!-- 固定导航栏 -->
    <div class="nav">网站导航（固定在顶部）</div>

    <!-- 整体容器 -->
    <div class="wrapper clearfix">
        <!-- 左侧侧边栏 -->
        <div class="sidebar">
            <h4>侧边导航</h4>
            <ul>
                <li>首页</li>
                <li>产品</li>
                <li>关于我们</li>
            </ul>
        </div>

        <!-- 右侧内容区 -->
        <div class="content">
            <div class="card">
                <div class="top-tag">置顶</div>
                <h3>综合布局实验</h3>
                <p>1. 导航栏固定在顶部，不随滚动移动；<br>
                    2. 左侧侧边栏浮动，右侧内容区自适应；<br>
                    3. 卡片的“置顶”角标使用子绝父相；<br>
                    4. 确保wrapper清除浮动，无高度塌陷。
                </p>
            </div>
        </div>
    </div>
</body>

</html>
